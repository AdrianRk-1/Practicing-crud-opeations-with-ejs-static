<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./refactoring.mjs" defer></script>
    <title>Products List</title>
  </head>
  <body>
    <section class="products">
      <h1>List of Total products</h1>
      <span id="status"></span>
      <ul id="list"></ul>
      <button id="button">Click Me</button>
    </section>

    <form id="create-product" action="/products" method="POST">
      <label for="name">Product Name</label>
      <input type="text" id="name" name="name" />
      <label for="price">Product Price</label>
      <input type="number" id="price" name="price" step="0.01" />

      <label for="category">Category</label>
      <input type="text" name="category" id="category" />

      <label for="colors">Colors</label>
      <input type="text" id="colors" name="colors" />
      <div id="color-container"></div>

      <button type="submit">Submit</button>
    </form>

    <form id="find-product" action="/products" method="GET">
      <label for="search">Search for Product</label>
      <input type="text" id="search" name="q" />
      <select name="categories" id="category-container"></select>
      <label for="max-price">Max Price</label>
      <input type="text" name="max-price" id="max-price" />

      <label for="category"></label>
      <button type="Submit">Find</button>
    </form>
  </body>
</html>
